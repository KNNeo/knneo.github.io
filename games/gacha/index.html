<!DOCTYPE html>
<html lang="en-SG">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
	<meta content="utf-8" http-equiv="encoding">
	<link id="bs-css" rel="stylesheet" type="text/css" href="../../resources/bootstrap-icons.css">
	<link id="fonts-css" rel="stylesheet" type="text/css" href="../../fonts.css">
	<link id="index-css" rel="stylesheet" type="text/css" href="index.css">
	<script src="../../theme.js"></script>
	<script src="../../fetch.js"></script>
	<script src="sql-wasm.js" defer></script>
	<script src="index.js" defer></script>
	<title>Suruga-cha</title>
</head>

<body>
	<header class="header">
		<h2>Suruga-cha</h2>
		<h3 class="settings">
			<a title="Generate Random Card" class="bi bi-shuffle" href="javascript:void(0);"
				onclick="generateRandomCard()"></a>
			<a title="Toggle Dark Mode" class="bi bi-brightness-high-fill" href="javascript:void(0);"
				onclick="toggleDarkMode()" oncontextmenu="customSetTheme()"></a>
			<a title="Go Home" class="bi bi-github" href="https://knneo.github.io/"></a>
		</h3>
	</header>
	<main class="page">
		<div class="card-view view"></div>
		<div class="library-view view"></div>
	</main>
	<footer class="footer">
		<button data-id="card-view" class="bi bi-person-badge" onclick="selectView()">&nbsp;Card</button>
		<button data-id="library-view" class="bi bi-collection" onclick="selectView()">&nbsp;Library</button>
	</footer>
</body>

</html>
