<!DOCTYPE html>
<html lang="en-SG">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
	<meta content="utf-8" http-equiv="encoding">
	<link id="fonts-css" rel="stylesheet" type="text/css" href="../../fonts.css">
	<link id="index-css" rel="stylesheet" type="text/css" href="index.css">
	<link id="bs-css" rel="stylesheet" type="text/css" href="../../resources/bootstrap-icons.css">
	<script src="../../theme.js"></script>
	<script src="index.js" defer></script>
	<title>Blogger Images Processor</title>
</head>

<body onload="startup()" onkeydown="onKeyDown()">
	<h2>Blogger Image Processor</h2>
	<h6>Wrapping images in HTML code into custom components, or just editing their dimensions</h6>
	<div class="page">
		<div class="options">
			<button onclick="onOptionClick(event)" title="Carousel">Carousel</button>
			<button onclick="onOptionClick(event)" title="Agenda">Agenda</button>
			<button onclick="onOptionClick(event)" title="Resize">Batch Resize (Small)</button>
		</div>
		<span>
			<label for="source">Source HTML:</label>
			<textarea id="source" rows="12" cols="50"></textarea>
		</span>
		<button onclick="onActionClick(event)" title="Convert">Convert</button>
		<span>
			<label for="dest">Output HTML:</label>
			<textarea id="dest" rows="12" cols="50"></textarea>
		</span>
		<button onclick="onActionClick(event)" title="Copy">Copy Result</button>
		<span class="message"></span>
	</div>
	<h3 class="settings">
		<a title="Toggle Dark Mode" class="darkmode material-icons" href="javascript:void(0);"
			onclick="toggleDarkMode()" oncontextmenu="customSetTheme()">brightness_high</a>
		<a title="Remove Links In Tables" class="links material-icons" href="javascript:void(0);"
			onclick="toggleKeepLinks()">link_off</a>
		<div class="spacer"> </div>
		<a href="https://knneo.github.io/">knneo.github.io</a>
	</h3>
</body>

</html>
